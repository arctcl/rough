<!-- Вкладка «Справка»: man по плагинам, вывод справа. -->
<h1>Справка по плагинам</h1>
<p>Нажми на плагин — справка появится справа</p>

<row>
  <div width="35%">
    <button action="man:chart" output="out">chart</button>
    <button action="man:ssh" output="out">ssh</button>
    <button action="man:set" output="out">set</button>
    <button action="man:toggle" output="out">toggle</button>
    <button action="man:cut" output="out">cut</button>
    <button action="man:awk" output="out">awk</button>
    <button action="man:grep" output="out">grep</button>
    <button action="man:sed" output="out">sed</button>
    <button action="man:tr" output="out">tr</button>
    <button action="man:sort" output="out">sort</button>
    <button action="man:uniq" output="out">uniq</button>
    <button action="man:bars" output="out">bars</button>
  </div>
  <div width="65%">
    <div id="out">Выбери плагин слева…</div>
  </div>
</row>
