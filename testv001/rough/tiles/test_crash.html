<!-- Тесты вылетов: обычная ошибка, паника (изоляция пайпов), полный краш (crash.log). -->
<div align="center">
  <h1>Тесты вылетов</h1>
  <p>Ошибка — обычная ошибка в окошке, интерфейс жив.</p>
  <p>Паника — движок ловит её в пайпе, трасса в окошке, интерфейс жив.</p>
  <p>Краш — полный вылет, рядом с бинарником появится crash.log.</p>
  <button action="chart:100:0">Ошибка</button>
  <button action="boom:bad_param">Паника</button>
  <button action="crash">Краш</button>
  <hr/>
  <div id="out"></div>
</div>
