name: CI

# Робот-инспектор: собирает проект и гоняет проверки на каждый пуш/PR.
# Цель — ловить регрессии сразу, особенно во время рефакторинга.

on:
  push:
  pull_request:

jobs:
  test:
    # Проверяем и на Linux (там есть gcc → можно -race), и на Windows
    # (движок активно используется на Windows).
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Сборка
        run: go build ./...

      - name: Vet (статический анализ)
        run: go vet ./...

      - name: Тесты
        run: go test ./...

      # -race ловит гонки данных; нужен C-компилятор (gcc) — только на Linux.
      - name: Тесты с -race (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
