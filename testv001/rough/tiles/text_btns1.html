<!-- Текст: кнопки группы 1. Результат пайпа уходит в тайл out1 (output="out1"). -->
<row>
  <div width="5%"></div>
  <div>
    <h1>Текст</h1>
    <button action="cat:numbers.txt" output="out1">cat</button>
    <button action="cat:numbers.txt | head:3" output="out1">cat | head:3</button>
    <button action="cat:numbers.txt | tail:3" output="out1">cat | tail:3</button>
    <button action="cat:numbers.txt | wc" output="out1">cat | wc</button>
    <button action="cat:numbers.txt | line:3" output="out1">cat | line:3</button>
    <button action="hello:мир" output="out1">hello</button>
  </div>
  <div width="5%"></div>
</row>
