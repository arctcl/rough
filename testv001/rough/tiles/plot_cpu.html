<!-- График нагрузки CPU: эмулятор emu_cpu → bars (живой). -->
<row>
  <div width="5%"></div>
  <div>
    <div align="center">
      <h1>Нагрузка CPU</h1>
      <plugin pipe="emu_cpu | chart:0:100:1:2" height="14" interval="2s"/>
      <p>emu_cpu → chart:0:100</p>
    </div>
  </div>
  <div width="5%"></div>
</row>
