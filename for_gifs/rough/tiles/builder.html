<!-- Вкладка «Конструктор»: собираем SELECT из полей, кнопки/крутилки/чекбоксы в колонках. -->
<h1>Конструктор запросов</h1>
<p>Собери SELECT — результат появится в блоке справа внизу</p>

<row>
  <div width="55%">
    <input action="query:SELECT" output="out" label="SELECT"/>
    <input action="query:FROM" output="out" label="FROM"/>
    <input action="query:WHERE" output="out" label="WHERE"/>
    <select action="opt:order" label="Сортировка" options="asc,desc"/>
    <select action="opt:limit" label="Лимит" options="10,50,100,all"/>
    <select action="opt:join" label="Join" options="inner,left,right"/>
  </div>
  <div width="45%">
    <checkbox action="flag:verbose">Подробный вывод</checkbox>
    <checkbox action="flag:index">Использовать индекс</checkbox>
    <checkbox action="flag:cache">Кэшировать</checkbox>
    <hr/>
    <button action="query:SELECT * FROM users | confirm">Выполнить</button>
    <button action="query:EXPLAIN SELECT">Explain</button>
    <button action="query:EXPORT">Экспорт</button>
    <button action="export:last_query">Запомнить</button>
  </div>
</row>
<hr/>
<div id="out">Здесь появится результат запроса…</div>
