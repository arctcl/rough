<!-- Темы: переключение на лету (плагин theme). Клик — тема применяется сразу. -->
<div align="center">
  <h1>Темы</h1>
  <p>Клик — тема применяется сразу, весь экран перерисовывается.</p>
  <button action="theme:orange">Оранжевая</button>
  <button action="theme:default">Стандартная</button>
  <button action="theme:day">Дневная</button>
  <button action="theme:terminal">Терминал</button>
  <button action="theme">Текущая тема</button>
  <button action="theme:list" output="out">Список тем</button>
  <hr/>
  <div id="out"></div>
</div>
