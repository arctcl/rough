<h1>What is it</h1>
<p><b>rough</b> — a tiled, resizable engine for terminal UIs.</p>
<p>Write HTML — get a clickable interface in the console.</p>
<p>Buttons, fields, selects, checkboxes, live charts, man pages — all of it
is command plugins: strings in, strings out.</p>
